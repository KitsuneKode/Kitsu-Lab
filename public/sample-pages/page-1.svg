<line x1="140" x2="1100" y1="570" y2="570" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="644" y2="644" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="718" y2="718" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="792" y2="792" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="866" y2="866" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="940" y2="940" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1014" y2="1014" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1088" y2="1088" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1162" y2="1162" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1236" y2="1236" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1310" y2="1310" stroke="#e7e1d2" stroke-width="2"/><line x1="140" x2="1100" y1="1384" y2="1384" stroke="#e7e1d2" stroke-width="2"/>
<text x="140" y="300" font-size="30" letter-spacing="6" fill="#8a8373">CHAPTER 1</text>
<text x="140" y="400" font-size="72" fill="#1f1e1b">Rivers of the valley</text>
<line x1="140" x2="420" y1="450" y2="450" stroke="#c9a24a" stroke-width="6"/>
<text x="140" y="560" font-size="40" fill="#3b3a36">The river rises in the eastern hills and</text><text x="140" y="634" font-size="40" fill="#3b3a36">widens as it crosses the plain. Its</text><text x="140" y="708" font-size="40" fill="#3b3a36">tributaries drain the northern slopes,</text><text x="140" y="782" font-size="40" fill="#3b3a36">and the floods of early summer renew</text><text x="140" y="856" font-size="40" fill="#3b3a36">the soil along both banks.</text>
<text x="620" y="1634" font-size="30" fill="#8a8373" text-anchor="middle">1</text>
</svg>